[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "qq_mcp_server"
version = "0.4.2"
description = "面向 COC 跑团的多群只读 QQ 同步与隔离 MCP 服务"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kscii", email = "xuejian-fang@outlook.com" }]
keywords = ["qq", "mcp", "onebot", "napcat", "trpg", "coc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "fastmcp>=3.1,<4",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "py-key-value-aio[filetree]>=0.4.5,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "starlette>=1,<2",
  "tzdata>=2026.1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
qq_mcp_server = "qq_mcp_server.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "types-openpyxl>=3.1,<4",
]

[tool.uv.build-backend]
module-name = "qq_mcp_server"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in tests against an explicitly configured QQ group"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/qq_mcp_server/ai_instructions.py" = ["E501"]
"src/qq_mcp_server/mcp_server.py" = ["E501"]
"src/qq_mcp_server/store.py" = ["E501"]
"src/qq_mcp_server/web.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["qq_mcp_server"]
